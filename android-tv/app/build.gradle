plugins { id 'com.android.application' }

android {
    namespace 'tv.dwim.app'
    compileSdk 34
    defaultConfig {
        applicationId 'tv.dwim.app'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }
    buildTypes {
        release {
            minifyEnabled false
            // Signed with the debug key unless you add your own keystore (see README in this folder).
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
