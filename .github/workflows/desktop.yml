name: Build desktop apps

on:
  workflow_dispatch:
  push:
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop.yml'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Create a fresh release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete desktop-latest --yes --cleanup-tag || true
          gh release create desktop-latest --target "${{ github.sha }}" --title "DWIM TV for Windows, Mac and Linux" \
            --notes "Desktop app for DWIM TV (opens dwim-tv.onrender.com). Built by Ntandomods. Windows: DWIM-TV-Setup.exe. Mac: DWIM-TV.dmg. Linux: DWIM-TV.AppImage."

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build
        working-directory: desktop
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm install
          npm run dist
      - name: Upload to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for f in desktop/dist/DWIM-TV-Setup.exe desktop/dist/DWIM-TV.AppImage desktop/dist/DWIM-TV.dmg; do
            if [ -f "$f" ]; then gh release upload desktop-latest "$f" --clobber; fi
          done
