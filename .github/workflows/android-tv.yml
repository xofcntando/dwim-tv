name: Build Android TV app

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-tv/**'
      - '.github/workflows/android-tv.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Accept Android SDK licenses (SDK is preinstalled on the runner)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK
        run: gradle -p android-tv assembleRelease --no-daemon
      - name: Name the APK
        run: cp android-tv/app/build/outputs/apk/release/app-release.apk DWIM-TV.apk
      - uses: actions/upload-artifact@v4
        with:
          name: DWIM-TV-apk
          path: DWIM-TV.apk
      - name: Publish to a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-tv-latest --yes --cleanup-tag || true
          gh release create android-tv-latest DWIM-TV.apk --title "DWIM TV for Android TV" \
            --notes "Android TV / phone app for DWIM TV (opens dwim-tv.onrender.com). Built by Ntandomods. Install: download DWIM-TV.apk, then sideload it (see android-tv/README.md)."
